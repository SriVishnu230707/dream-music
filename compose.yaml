services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mooddrift
      POSTGRES_PASSWORD: local-demo-only
      POSTGRES_DB: mooddrift
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - phase5_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mooddrift -d mooddrift"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  phase5_postgres:
